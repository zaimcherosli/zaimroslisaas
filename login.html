<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login — Zaim Rosli (REN39575)</title>
  <meta name="description" content="Admin login portal for managing Zaim Rosli property listings.">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      position: relative;
      overflow: hidden;
    }
    
    .login-wrapper::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.08) 0%, rgba(255,255,255,0) 70%);
      top: -100px;
      right: -100px;
      pointer-events: none;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 44px 36px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
      position: relative;
      z-index: 10;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .login-logo {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: 0 auto 10px;
    }

    .login-logo-main {
      font-family: var(--font-heading);
      font-size: 2.1rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      line-height: 1.1;
      text-align: center;
    }

    .login-logo-main span {
      color: var(--accent-gold);
    }

    .login-logo-sub {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: center;
      white-space: nowrap;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.92rem;
      text-align: center;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-main);
      margin-bottom: 8px;
      text-align: left;
    }

    .form-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background: #f8fafc;
      font-size: 0.95rem;
      color: var(--text-main);
      transition: all 0.25s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent-gold);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.12);
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #ef4444;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      font-size: 0.98rem;
      font-weight: 700;
      border-radius: 12px;
      background: var(--accent-gold);
      color: #ffffff;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(217, 119, 6, 0.25);
    }

    .btn-submit:hover {
      background: var(--accent-gold-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(217, 119, 6, 0.35);
    }

    .back-home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-home-link:hover {
      color: var(--accent-gold);
    }
  </style>
  <script src="/analytics.js?v=91" defer></script>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <span class="login-logo-main">ZAIM<span>ROSLI</span></span>
          <span class="login-logo-sub">REGISTERED REAL ESTATE PORTAL</span>
        </div>
        <p>Sign in to manage your property listings</p>
      </div>

      <div id="error-box" class="error-box"></div>

      <form id="login-form-el">
        <div class="form-group">
          <label class="form-label" for="login-email">EMAIL ADDRESS</label>
          <input type="email" id="login-email" class="form-input" value="huzaimrosli@gmail.com" placeholder="name@example.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 26px;">
          <label class="form-label" for="login-password">PASSWORD</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" id="login-btn-submit" class="btn-submit">
          🔐 Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 28px;">
        <a href="index.html" class="back-home-link">← Back to Homepage</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://csrzhidtzqxfbapsenhu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcnpoaWR0enF4ZmJhcHNlbmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTM3OTYsImV4cCI6MjEwMTA2OTc5Nn0.NnHFURbQTvsdgGbm1d_PC-hkOgQFQIHKTMQaS2n44SU';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkUser() {
      if (window.location.search.includes('logout=true')) {
        try {
          await supabaseClient.auth.signOut();
          localStorage.removeItem('ZAIM_ROSLI_SESSION');
          sessionStorage.clear();
        } catch (e) {}
        return;
      }
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session || localStorage.getItem('ZAIM_ROSLI_SESSION')) {
        window.location.href = 'admin.html';
      }
    }
    checkUser();

    const form = document.getElementById('login-form-el');
    const submitBtn = document.getElementById('login-btn-submit');
    const errorBox = document.getElementById('error-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Processing...';
      errorBox.style.display = 'none';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        localStorage.setItem('ZAIM_ROSLI_SESSION', JSON.stringify({ email: data.user.email, loggedInAt: Date.now() }));
        window.location.href = 'admin.html';
      } catch (err) {
        console.error('Login error:', err);
        errorBox.textContent = 'Invalid email address or password. Please try again.';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '🔐 Sign In';
      }
    });
  </script>
</body>
</html>
